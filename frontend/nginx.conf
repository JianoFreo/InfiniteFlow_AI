# Serves the built React app and forwards /api to the BFF (the only backend the browser can reach).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 4g;

    # Live job stream (SSE): never buffer, keep the connection open
    location = /api/jobs/stream {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Stream uploads to the BFF as they arrive (the BFF streams them on to media-service)
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # React Router: unknown paths load the app
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
