spring.application.name=interpolation-worker
spring.config.import=optional:file:env.properties
server.port=${PORT:8083}

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# One chunk at a time per replica: a replica holds exactly one unacked chunk, the rest stay in the
# queue for other replicas. Scale out with more replicas, not more threads.
spring.rabbitmq.listener.simple.prefetch=1
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=1

# Other services
worker.job-service-url=${JOB_SERVICE_URL:http://localhost:8081}
# Shown in the UI chunk details and logs; docker sets HOSTNAME to the container id
worker.name=${WORKER_NAME:${HOSTNAME:local-worker}}

# The Python engine (pure computation, started once per chunk)
worker.python-command=${ENGINE_PYTHON:python}
worker.engine-dir=${ENGINE_DIR:../interpolation-engine}
# How often a running chunk reports progress to job-service
worker.progress-interval-ms=${PROGRESS_INTERVAL_MS:500}
# A chunk that runs longer than this is killed and treated as a failure
worker.chunk-timeout-minutes=${CHUNK_TIMEOUT_MINUTES:30}
# After SIGTERM, how long the engine gets to stop cleanly before it is killed
worker.stop-grace-seconds=${STOP_GRACE_SECONDS:10}

management.endpoints.web.exposure.include=health
