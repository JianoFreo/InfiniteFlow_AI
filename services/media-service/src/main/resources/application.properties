spring.application.name=media-service
spring.config.import=optional:file:env.properties
server.port=${PORT:8082}

# Postgres (database-per-service: media-service owns media_db, nobody else reads it)
# Example: DB_URL=jdbc:postgresql://localhost:5432/media_db?user=app&password=app
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Shared volume with the interpolation-engine
app.storage.root=${FILE_ROOT:/data}

# Uploads: write the multipart temp file on the same volume so transferTo() is a rename, not a copy
spring.servlet.multipart.max-file-size=4GB
spring.servlet.multipart.max-request-size=4GB
spring.servlet.multipart.location=${FILE_ROOT:/data}/tmp
server.tomcat.max-swallow-size=-1

management.endpoints.web.exposure.include=health
