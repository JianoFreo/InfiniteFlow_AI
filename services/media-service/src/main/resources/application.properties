spring.application.name=media-service
spring.config.import=optional:file:env.properties
server.port=${PORT:8082}

# Postgres (database-per-service: media-service owns media_db, nobody else reads it)
# Example: DB_URL=jdbc:postgresql://localhost:5432/media_db?user=app&password=app
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Where this service keeps its video files. No other service reads this folder.
app.storage.root=${FILE_ROOT:/data}

# Every request (except the health check) must send this in X-Internal-Key
app.internal-key=${INTERNAL_KEY:dev-internal-key}

# Limit for small hosts: width x height. 0 means no limit.
app.max-video-pixels=${MAX_VIDEO_PIXELS:0}

# Uploads: write the multipart temp file on the same volume so transferTo() is a rename, not a copy
spring.servlet.multipart.max-file-size=${MAX_UPLOAD_SIZE:4GB}
spring.servlet.multipart.max-request-size=${MAX_UPLOAD_SIZE:4GB}
spring.servlet.multipart.location=${FILE_ROOT:/data}/tmp
server.tomcat.max-swallow-size=-1

# Small database pools suit a small host
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

management.endpoints.web.exposure.include=health
