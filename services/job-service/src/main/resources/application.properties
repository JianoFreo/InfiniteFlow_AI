spring.application.name=job-service
spring.config.import=optional:file:env.properties
server.port=${PORT:8081}

# Postgres (database-per-service: job-service owns jobs_db)
# Example: DB_URL=jdbc:postgresql://localhost:5432/jobs_db?user=app&password=app
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
# A listener exception must not requeue the same message forever
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Other services / shared volume
app.media-service-url=${MEDIA_SERVICE_URL:http://localhost:8082}
app.storage-root=${FILE_ROOT:/data}
app.chunk-seconds=${CHUNK_SECONDS:2}

management.endpoints.web.exposure.include=health
