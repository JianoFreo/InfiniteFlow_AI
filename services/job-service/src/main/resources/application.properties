spring.application.name=job-service
spring.config.import=optional:file:env.properties
server.port=${PORT:8081}

# Postgres (database-per-service: job-service owns jobs_db)
# Example: DB_URL=jdbc:postgresql://localhost:5432/jobs_db?user=app&password=app
spring.datasource.url=${DB_URL}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Other services. FILE_ROOT is this service's own scratch folder for the video it is working on.
app.media-service-url=${MEDIA_SERVICE_URL:http://localhost:8082}
app.storage-root=${FILE_ROOT:/data}
app.chunk-seconds=${CHUNK_SECONDS:2}

# Live updates: every job change is pushed here so the browser sees it instantly (the BFF checks the key)
app.bff-events-url=${BFF_EVENTS_URL:http://localhost:5000/internal/job-events}
app.internal-key=${INTERNAL_KEY:dev-internal-key}

# The Python engine (pure computation, started once per chunk)
app.python-command=${ENGINE_PYTHON:python}
app.engine-dir=${ENGINE_DIR:../interpolation-engine}
# How many chunks run at the same time. More threads = faster videos but more CPU and RAM.
app.engine-threads=${ENGINE_THREADS:2}
# How often a running chunk reports progress
app.progress-interval-ms=${PROGRESS_INTERVAL_MS:500}
# A chunk that runs longer than this is killed and treated as a failure
app.chunk-timeout-minutes=${CHUNK_TIMEOUT_MINUTES:30}
# After SIGTERM, how long the engine gets to stop cleanly before it is killed
app.stop-grace-seconds=${STOP_GRACE_SECONDS:10}

# How many videos can run at once per person. Guests: 1. Signed-in users: several side by side.
app.max-active-guest-jobs=${MAX_ACTIVE_GUEST_JOBS:1}
app.max-active-user-jobs=${MAX_ACTIVE_USER_JOBS:5}

# Free hosting puts a service to sleep when no requests come in. While a job is running, these URLs are
# called every few minutes. Comma separated; empty = off.
app.keep-awake-urls=${KEEP_AWAKE_URLS:}
app.keep-awake-interval-ms=${KEEP_AWAKE_INTERVAL_MS:300000}

# Small database pools suit a small host
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

management.endpoints.web.exposure.include=health
