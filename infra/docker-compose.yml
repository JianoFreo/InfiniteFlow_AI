# InfiniteFlow: BFF + 3 microservices
#
#   browser ─► frontend (nginx :8080) ─► backend / BFF (:5000)
#                                          ├─► job-service   (Spring, :8081) ─► jobs_db
#                                          └─► media-service (Spring, :8082) ─► media_db + /data
#   job-service ─(RabbitMQ)─► interpolation-engine × N ─(RabbitMQ)─► job-service ─► BFF ─(SSE)─► browser
#
# Run from the repo root:   docker compose -f infra/docker-compose.yml up --build
# More engine replicas:     docker compose -f infra/docker-compose.yml up -d --scale interpolation-engine=4

name: infiniteflow

x-db-env: &db-credentials
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *db-credentials
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # -h 127.0.0.1: check over TCP. During first-time init Postgres runs a socket-only temp server
      # that would pass a socket check before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d jobs_db && pg_isready -h 127.0.0.1 -U app -d media_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "15672:15672" # management UI: http://localhost:15672 (guest / guest)
    healthcheck:
      # check_port_connectivity waits until the AMQP port accepts connections (ping passes earlier)
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 30

  media-service:
    build: ../services/media-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/media_db?user=app&password=app
      FILE_ROOT: /data
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  job-service:
    build: ../services/job-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobs_db?user=app&password=app
      RABBITMQ_HOST: rabbitmq
      MEDIA_SERVICE_URL: http://media-service:8082
      FILE_ROOT: /data
      CHUNK_SECONDS: "2"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  interpolation-engine:
    build: ../services/interpolation-engine
    environment:
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/%2F
      JOB_SERVICE_URL: http://job-service:8081
      FLOW_PRESET: medium
      FLOW_MAX_SIDE: "640"
      # CPU threads per replica. Rule of thumb: CPU cores / replicas (0 = all cores). 4 x 3 measured best on 12 cores.
      ENGINE_THREADS: ${ENGINE_THREADS:-3}
    volumes:
      - data:/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    deploy:
      replicas: ${ENGINE_REPLICAS:-4}
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      PORT: "5000"
      NODE_ENV: production
      JOB_SERVICE_URL: http://job-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - "5000:5000" # exposed so `npm run dev` in frontend/ can use it too
    depends_on:
      job-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  data:
