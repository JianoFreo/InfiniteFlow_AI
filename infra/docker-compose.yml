# InfiniteFlow: a BFF + 2 Java microservices. Python is only the AI math, run by job-service.
#
#   browser ─► frontend (nginx :8080) ─► backend / BFF (:5000)
#                                          ├─► job-service   (Spring, :8081) ─► jobs_db
#                                          └─► media-service (Spring, :8082) ─► media_db + its own /data
#   No shared disk: job-service downloads the source and uploads the chunks over HTTP.
#   job-service splits a video into chunks and runs them on its own thread pool:
#                                          └─ per chunk: python -m app.run_chunk  (NumPy math, stdin/stdout only)
#   job-service ─(HTTP, after every change)─► BFF ─(SSE)─► browser     live progress, no polling
#
# Run from the repo root:   docker compose -f infra/docker-compose.yml up --build
# Faster videos:            raise ENGINE_THREADS under job-service (chunks processed at the same time)

name: infiniteflow

x-db-env: &db-credentials
  POSTGRES_USER: app
  POSTGRES_PASSWORD: app

services:
  postgres:
    image: postgres:16-alpine
    environment:
      <<: *db-credentials
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      # -h 127.0.0.1: check over TCP. During first-time init Postgres runs a socket-only temp server
      # that would pass a socket check before the real server is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U app -d jobs_db && pg_isready -h 127.0.0.1 -U app -d media_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  media-service:
    build: ../services/media-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/media_db?user=app&password=app
      FILE_ROOT: /data
      INTERNAL_KEY: ${INTERNAL_KEY:-change-me-too}
    volumes:
      - data:/data
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  job-service:
    build:
      context: ../services          # needs both job-service/ (Java) and interpolation-engine/ (Python)
      dockerfile: job-service/Dockerfile
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobs_db?user=app&password=app
      MEDIA_SERVICE_URL: http://media-service:8082
      FILE_ROOT: /data
      CHUNK_SECONDS: "2"
      # Live updates: job-service pushes every change to the BFF, which shows it in open browsers
      BFF_EVENTS_URL: http://backend:5000/internal/job-events
      INTERNAL_KEY: ${INTERNAL_KEY:-change-me-too}
      # How many chunks the Python engine processes at the same time. Raise it on a bigger machine.
      ENGINE_THREADS: "2"
      MAX_ACTIVE_GUEST_JOBS: "1"
      MAX_ACTIVE_USER_JOBS: "5"
      # Read by the Python engine (inherited by the child process)
      FLOW_PRESET: medium
      FLOW_MAX_SIDE: "640"
    volumes:
      - job-data:/data # its own scratch space
    depends_on:
      postgres:
        condition: service_healthy
      media-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  backend:
    build: ../backend
    environment:
      PORT: "5000"
      NODE_ENV: production
      JOB_SERVICE_URL: http://job-service:8081
      MEDIA_SERVICE_URL: http://media-service:8082
      INTERNAL_KEY: ${INTERNAL_KEY:-change-me-too}
      AUTH_SECRET: ${AUTH_SECRET:-change-me-before-going-public}
      CORS_ORIGIN: http://localhost:8080,http://localhost:5173
    ports:
      - "5000:5000" # exposed so `npm run dev` in frontend/ can use it too
    depends_on:
      job-service:
        condition: service_healthy
      media-service:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ../frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  data:
  job-data:
